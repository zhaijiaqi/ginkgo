cg:
  max_iter: 1000
  stop_tol: 1e-10
  matrix_size: 512  # 矩阵大小 (n x n)，当使用真实矩阵时会被覆盖
  matrix_name: Muu  # 矩阵名称，从 matrix_set.csv 中选择， Muu(7102), minsurfo(40806, model不收敛), mesh3e1(289), qa8fm(66127), thermomech_TC(102158, unknown)
  matrix_data_dir: ~/data/matrix  # 矩阵数据目录
  matrix_set_csv: matrix_set.csv  # 矩阵信息CSV文件

spmv:
  tilesize: 64
  precision_cost_table:
    fp64: 1.0
    fp32: 0.5
    fp16: 0.25
    fp8: 0.125

reward:
  type: weighted
  w1: 10  # 数值误差奖励权重
  w2: 0.1  # 计算成本奖励权重
  w3: 100.0 # 收敛性奖励权重
  w4: 2.0  # 发散惩罚权重
  # w1: 10
  # w2: 1
  # w3: 20
  # w4: 2.0

ppo:
  gamma: 0.99                # 折扣因子
  learning_rate: 1e-4        # 学习率，降低可提高稳定性
  n_epochs: 10               # 每次更新时训练所有数据的轮数salloc -x paraai-n32-h-01-agent-[1,4,8,16-17,25,27-31] --gpus=卡数
  batch_size: 1024            # 每个更新周期的小批量样本数
  clip_range: 0.2            # PPO策略损失裁剪参数ε
  value_coef: 0.25            # value function 损失的权重
  entropy_coef: 0.02         # 熵奖励系数，鼓励探索
  gpu: 0                    # GPU设备编号，-1表示自动选择可用GPU
  update_interval: 1024       # 网络参数每隔多少步更新一次
  hidden_sizes: [64, 64]     # 神经网络隐藏层大小列表, 如[64,64]为两层每层64单元
  max_grad_norm: 0.5         # 梯度裁剪最大范数
  standardize_advantages: true  # 启用 advantage normalization（标准化优势函数）
  lambda: 0.95               # GAE (Generalized Advantage Estimation) 的 lambda 参数

train:
  total_episodes: 200
  eval_interval_episode: 20
  eval_interval: None
  eval_n_episodes: 5
  save_interval_episode: 100
  save_interval: None

env:
  normalize_state: true
